# Keep only the CI artifact-bucket exceptions. Lambda checks are not globally
# suppressed; any Lambda resource must carry a resource-level rationale.
skip-check:
  # S3 suppressions — ephemeral CI artifact bucket with 7-day expiry
  - CKV_AWS_18 # Access logging
  - CKV_AWS_21 # Versioning
output:
  - cli
  - json
output-file-path: console,dist/packages/ci-infra/checkov/checkov_report.json
