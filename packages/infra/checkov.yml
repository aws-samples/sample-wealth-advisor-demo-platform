# CDK creates cross-region reference provider Lambdas after construct metadata
# is finalized. These framework-managed providers cannot be configured with
# application concurrency, DLQ, or VPC settings. Application Lambdas carry
# resource-level rationales in ApplicationStack instead of relying on these IDs.
skip-check:
  - CKV_AWS_115
  - CKV_AWS_116
  - CKV_AWS_117
output:
  - cli
  - json
output-file-path: console,dist/packages/infra/checkov/checkov_report.json
